name: Unity EditMode tests

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  editmode-tests:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Unity license configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "Configure UNITY_LICENSE, or configure UNITY_EMAIL and UNITY_PASSWORD, in repository Actions secrets." >&2
            exit 1
          fi

      - name: Run Unity EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: UnityProject
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode tests

      - name: Upload EditMode test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity EditMode test results (JUnit XML)
          path: artifacts/editmode-results.xml
          if-no-files-found: warn

      - name: Publish EditMode test summary
        if: always()
        env:
          TEST_RESULTS_PATH: artifacts/editmode-results.xml
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          results_path = Path(os.environ["TEST_RESULTS_PATH"])
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          outcome = os.environ.get("TEST_OUTCOME", "unknown")

          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("## Unity EditMode test results\n\n")

              if not results_path.is_file():
                  summary.write(
                      f"Test step outcome: **{outcome}**. "
                      f"JUnit XML was not found at `{results_path}`.\n"
                  )
                  raise SystemExit(0)

              try:
                  root = ET.parse(results_path).getroot()
              except (ET.ParseError, OSError) as error:
                  summary.write(
                      f"Test step outcome: **{outcome}**. "
                      f"Could not read JUnit XML: `{error}`.\n"
                  )
                  raise SystemExit(0)

              counts = {
                  name: root.attrib.get(name, "0")
                  for name in ("total", "passed", "failed", "skipped", "inconclusive")
              }
              summary.write(f"Test step outcome: **{outcome}**\n\n")
              summary.write("| Total | Passed | Failed | Skipped | Inconclusive |\n")
              summary.write("| ---: | ---: | ---: | ---: | ---: |\n")
              summary.write(
                  "| {total} | {passed} | {failed} | {skipped} | {inconclusive} |\n".format(**counts)
              )

              failed_tests = [
                  test_case
                  for test_case in root.findall(".//test-case")
                  if test_case.attrib.get("result", "").lower() in {"failed", "error"}
              ]
              if failed_tests:
                  summary.write("\n### Failed tests\n\n")
                  for test_case in failed_tests:
                      name = test_case.attrib.get("fullname") or test_case.attrib.get("name", "Unknown test")
                      name = name.replace("|", "\\|").replace("\n", " ")
                      details = test_case.find("failure")
                      if details is None:
                          details = test_case.find("error")
                      message = " ".join("".join(details.itertext()).split()) if details is not None else "No failure message in XML."
                      message = message.replace("|", "\\|").replace("\n", " ")
                      if len(message) > 1000:
                          message = message[:997] + "..."
                      summary.write(f"- **`{name}`** — {message}\n")
          PY
